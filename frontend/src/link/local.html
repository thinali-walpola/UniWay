
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniWay.lk</title>

    <link rel="stylesheet" href="../../src/css/style-01.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-leaf"></i> UniWay
        </div>

        <ul class="nav-links" id="myTopnav">
            <li><a href="../../../index.html">Home</a></li>
            <li><a href="#">International</a></li>
            <li><a href="local.html" class="active">Local</a></li>
            <li><a href="event.html" >Events & News</a></li>
            <li><a href="#">About us</a></li>
        </ul>

        <div class="nav-icons">
            <i class="fa-solid fa-search"></i>
        </div>

        <button class="menu-icon"
                type="button"
                onclick="toggleMenu()"
                aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

    </nav>

    <!-- HERO SECTION -->

    <section class="event-hero">

        <div class="image-gallery">
            <img  class="img6">
            <img  class="img7">
            <img class="img8">
            <img class="img9">
            <img class="img10">
            
        </div>

        <div class="hero-container">
            <div class="hero-text">                                                       >
                <h1>Events & News</h1>
                <p>
                    Your trusted guide to university education
                    and academic opportunities.
                </p>
            </div>
        </div>
    
        
    </section>
    
    <!-- SEARCH SECTION -->
    <section class="search-section">

        <div class="search-content">

            <input type="text" id="searchEvent"
                   placeholder="Search events...">

            <input type="text" id="searchLocation"
                   placeholder="Search location...">

            <input type="text" id="searchType"
                   placeholder="Search event type...">

            <button type="button" id="searchButton">
                <i class="fa-solid fa-search"></i>
            </button>

        </div>
    </section>


    <script src="../js/script.js"></script>
</body>
</html>
